workflows:
  ios-cloud-check:
    name: Secure By Design - iOS Cloud Check
    instance_type: mac_mini_m2
    triggering:
      events:
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: false
      cancel_previous_builds: true
    max_build_duration: 30
    environment:
      flutter: 3.47.6
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $HOME/.pub-cache
    scripts:
      - name: Restore Flutter packages
        script: flutter pub get
      - name: Analyze source
        script: flutter analyze
      - name: Run tests
        script: flutter test
      - name: Compile unsigned iOS application
        script: flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/*.app
      - previews/*.png
      - /tmp/xcodebuild_logs/*.log

  ios-testflight:
    name: Secure By Design - TestFlight
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    max_build_duration: 60
    integrations:
      app_store_connect: secure_by_design_apple
    environment:
      flutter: 3.47.6
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.securebydesigninc.secureByDesignApp
    cache:
      cache_paths:
        - $HOME/.pub-cache
    scripts:
      - name: Restore Flutter packages
        script: flutter pub get
      - name: Analyze source
        script: flutter analyze
      - name: Run tests
        script: flutter test
      - name: Apply Apple signing profiles
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: >-
          flutter build ipa --release
          --build-number=$PROJECT_BUILD_NUMBER
          --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - previews/*.png
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration


  # Android: build a release app bundle signed with the Google Play upload key.
  # Start manually. Upload the .aab from this build to Play Console by hand the first time
  # (Google Play requires the first version of a new app to be uploaded manually).
  android-release-bundle:
    name: Secure By Design - Android app bundle
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.47.6
      java: 17
      android_signing:
        - sbd_upload_key
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/.gradle/caches
    scripts: &android_scripts
      - name: Restore Flutter packages
        script: flutter pub get
      - name: Analyze source
        script: flutter analyze
      - name: Run tests
        script: flutter test
      - name: Build signed app bundle
        # Version codes must always increase on Google Play; minutes since 1970 do, across workflows.
        script: >-
          flutter build appbundle --release
          --build-number=$(( $(date +%s) / 60 ))
      - name: Confirm the upload key signed the bundle
        script: |
          if keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab | grep -q "CN=Android Debug"; then
            echo "The bundle is signed with the debug key. Check the sbd_upload_key keystore in Codemagic." >&2
            exit 1
          fi
    artifacts: &android_artifacts
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/mapping/release/mapping.txt
      - previews/*.png

  # Android: same build, then upload to the Google Play internal testing track as a draft.
  # Needs the google_play environment group with GCLOUD_SERVICE_ACCOUNT_CREDENTIALS, and the
  # app must already exist in Play Console with its first bundle uploaded.
  android-play-internal:
    name: Secure By Design - Google Play internal testing
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.47.6
      java: 17
      android_signing:
        - sbd_upload_key
      groups:
        - google_play
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/.gradle/caches
    scripts: *android_scripts
    artifacts: *android_artifacts
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
