name: secure_by_design_app
description: A native Secure By Design learning companion proof of concept.
publish_to: none
version: 0.4.0+16

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  share_plus: ^13.3.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/brand-mark.png
    - assets/training/network.json
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist.ttf
