name: Codemagic build details (temporary)

# Diagnostic helper (not for main): downloads the IPA from one finished Codemagic build and prints the version,
# the signing profile and the entitlements actually signed into the app.
on:
  push:
    branches: ['diag/codemagic']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CM_TOKEN: ${{ secrets.CM_API_TOKEN }}
      BUILD_ID: 6ac867193d46751c93928648
    steps:
      - name: Signed app entitlements
        run: |
          set -uo pipefail
          curl -sS -H "x-auth-token: $CM_TOKEN" "https://api.codemagic.io/builds/$BUILD_ID" > build.json
          url=$(jq -r '[.build.artefacts[]? | select(.type=="ipa") | .url][0] // empty' build.json)
          [ -z "$url" ] && { echo "::error title=IPA::no IPA artifact on build $BUILD_ID"; exit 1; }
          curl -sS -L -H "x-auth-token: $CM_TOKEN" "$url" -o app.ipa
          mkdir x && (cd x && unzip -qo ../app.ipa)
          app=$(ls -d x/Payload/*.app | head -1)
          python3 - "$app" <<'PY'
          import plistlib, re, struct, sys
          app = sys.argv[1]
          def note(title, text): print(f"::notice title={title}::" + text.replace('%', '%25').replace('\n', ' | ')[:3800])
          info = plistlib.load(open(f'{app}/Info.plist', 'rb'))
          note('App', f"{info.get('CFBundleIdentifier')} version {info.get('CFBundleShortVersionString')} build {info.get('CFBundleVersion')}, minimum iOS {info.get('MinimumOSVersion')}")
          raw = open(f'{app}/embedded.mobileprovision', 'rb').read()
          prof = plistlib.loads(raw[raw.index(b'<?xml'):raw.index(b'</plist>') + 8])
          ent = prof.get('Entitlements', {})
          note('Signing profile', f"{prof.get('Name')} (team {','.join(prof.get('TeamIdentifier', []))}, created {prof.get('CreationDate')}, expires {prof.get('ExpirationDate')}); associated-domains in profile: {ent.get('com.apple.developer.associated-domains')}")
          data = open(f"{app}/{info['CFBundleExecutable']}", 'rb').read()
          if struct.unpack('>I', data[:4])[0] == 0xcafebabe:
              _, _, off, size, _ = struct.unpack('>iiIII', data[8:28]); data = data[off:off + size]
          assert struct.unpack('<I', data[:4])[0] == 0xfeedfacf, 'not a 64-bit Mach-O'
          ncmds = struct.unpack('<I', data[16:20])[0]; off = 32; sig = None
          for _ in range(ncmds):
              cmd, size = struct.unpack('<II', data[off:off + 8])
              if cmd == 0x1d: sig = struct.unpack('<II', data[off + 8:off + 16])
              off += size
          blob = data[sig[0]:sig[0] + sig[1]]
          _, _, count = struct.unpack('>III', blob[:12])
          signed = None
          for i in range(count):
              _, boff = struct.unpack('>II', blob[12 + 8 * i:20 + 8 * i])
              magic, length = struct.unpack('>II', blob[boff:boff + 8])
              if magic == 0xfade7171: signed = plistlib.loads(blob[boff + 8:boff + length])
          if signed is None:
              print('::error title=Entitlements::none found in the code signature'); sys.exit(1)
          note('Signed entitlements', '; '.join(f"{k} = {v}" for k, v in sorted(signed.items())))
          want = {'applinks:securebydesigninc.com', 'webcredentials:securebydesigninc.com'}
          have = set(signed.get('com.apple.developer.associated-domains', []))
          if want <= have: note('App links', 'present in the signed app: ' + ', '.join(sorted(want)))
          else: print(f"::error title=App links::missing from the signed app: {sorted(want - have)}"); sys.exit(1)
          PY
