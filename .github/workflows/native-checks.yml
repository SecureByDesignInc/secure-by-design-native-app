name: Native app checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: native-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      FLUTTER_SUPPRESS_ANALYTICS: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Restore packages
        run: flutter pub get
      - name: Analyze app
        shell: bash
        run: flutter analyze 2>&1 | tee analyze-output.txt
      - name: Run app tests
        shell: bash
        run: flutter test 2>&1 | tee test-output.txt
      - name: Report failure details on the pull request
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Native app checks failed'
            if [ -f analyze-output.txt ]; then
              echo '#### flutter analyze (last 80 lines)'
              echo '```'
              tail -n 80 analyze-output.txt
              echo '```'
            fi
            if [ -f test-output.txt ]; then
              echo '#### flutter test (last 120 lines)'
              echo '```'
              tail -n 120 test-output.txt
              echo '```'
            fi
          } > failure-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body-file failure-comment.md
      - name: Collect app previews
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-app-previews
          path: previews/*.png
          if-no-files-found: ignore
          retention-days: 7
